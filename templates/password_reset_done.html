{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent — HPAP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>

<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">
                <h1>HPAP</h1>
            </div>
            <p class="auth-subtitle">Check your email</p>
        </div>
        <div class="auth-card">
            <p style="font-size:0.875rem;color:#6b7280;margin-bottom:1.5rem;text-align:center">
                We have sent a password reset link to your email address. Please check your inbox and follow the
                instructions.
            </p>
            <a href="{% url 'auth_page' %}" class="btn-primary"
                style="display:block;text-align:center;text-decoration:none">
                Back to Login
            </a>
        </div>
    </div>
</body>

</html>
