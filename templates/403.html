{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied — HPAP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: #1f2937;
        }

        .error-container {
            text-align: center;
            max-width: 480px;
        }

        .error-code {
            font-family: 'Poppins', sans-serif;
            font-size: 6rem;
            font-weight: 700;
            color: #0078c2;
            line-height: 1;
            margin-bottom: 1rem;
        }

        .error-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 0.75rem;
        }

        .error-desc {
            font-size: 0.9375rem;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .error-btn {
            display: inline-flex;
            align-items: center;
            padding: 0.75rem 1.5rem;
            background: #0078c2;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9375rem;
            transition: background 0.2s;
        }

        .error-btn:hover {
            background: #006aa8;
        }

        .error-icon {
            width: 5rem;
            height: 5rem;
            margin: 0 auto 1.5rem;
            color: #0078c2;
            opacity: 0.3;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <p class="error-code">403</p>
        <h1 class="error-title">Access Denied</h1>
        <p class="error-desc">
            You do not have permission to access this page.
            Please log in with the correct account or return to the homepage.
        </p>
        <a href="/" class="error-btn">Go to Homepage</a>
    </div>
</body>

</html>
