{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Volunteering - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>

<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2c0 1.1.9 2 2 2h5v5c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2h-2z" />
                </svg>
                <h1>Hospital Volunteering</h1>
            </div>
            <p class="auth-subtitle">Make a difference in your community</p>
        </div>

        <div class="auth-card">
            <div class="tabs">
                <button type="button" class="tab-btn active" data-tab="login">Login</button>
                <button type="button" class="tab-btn" data-tab="signup">Sign Up</button>
            </div>

            <!-- Login Form -->
            <div id="login" class="tab-content active">
                <form action="{% url 'login' %}" method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="login-email" class="form-label">Email</label>
                        <input type="email" id="login-email" name="email" class="form-input"
                            placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="login-password" class="form-label">Password</label>
                        <input type="password" id="login-password" name="password" class="form-input"
                            placeholder="Enter your password" required>
                    </div>



                    <button type="submit" class="btn-primary">Login</button>
                </form>

                <p class="auth-footer">
                    Don't have an account? <a href="#" class="switch-tab" data-tab="signup">Sign up</a>
                </p>
            </div>

            <!-- Sign Up Form -->
            <div id="signup" class="tab-content">
                <form action="{% url 'signup' %}" method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="signup-name" class="form-label">Full Name</label>
                        <input type="text" id="signup-name" name="full_name" class="form-input"
                            placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-email" class="form-label">Email</label>
                        <input type="email" id="signup-email" name="email" class="form-input"
                            placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-password" class="form-label">Password</label>
                        <input type="password" id="signup-password" name="password" class="form-input"
                            placeholder="Create a password" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-level" class="form-label">Academic Level</label>
                        <select id="signup-level" name="academic_level" class="form-select" required>
                            <option value="" disabled selected>Select your academic level</option>
                            <option value="freshman">Freshman</option>
                            <option value="sophomore">Sophomore</option>
                            <option value="junior">Junior</option>
                            <option value="senior">Senior</option>
                            <option value="graduate">Graduate Student</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-primary">Create Account</button>
                </form>

                <p class="auth-footer">
                    Already have an account? <a href="#" class="switch-tab" data-tab="login">Login</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Tab switching functionality
        document.querySelectorAll('.tab-btn, .switch-tab').forEach(btn => {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                const targetTab = this.dataset.tab;

                // Update tab buttons
                document.querySelectorAll('.tab-btn').forEach(tab => {
                    tab.classList.remove('active');
                    if (tab.dataset.tab === targetTab) {
                        tab.classList.add('active');
                    }
                });

                // Update tab content
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.remove('active');
                });
                document.getElementById(targetTab).classList.add('active');
            });
        });
    </script>
</body>

</html>
